name: Deploy React in branch main to Github Pages

on:
  push:
    branches:
      - "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build all apps
        shell: bash
        run: |
          set -e

          mkdir -p site

          echo "Building main app..."

          npm ci
          npm run build

          mkdir -p site
          cp -R build/. site/

          for app in [0-9][0-9][0-9]-*/; do
            [ -d "$app" ] || continue
            app="${app%/}"

            echo "======================================"
            echo "Building sub-app: $app"
            echo "======================================"

            cd "$app"

            npm ci
            npm run build

            cd ..

            mkdir -p "site/$app"
            cp -R "$app/build/." "site/$app/"

          done

      - name: Inspect site
        run: |
          echo "=== SITE ==="
          find ./site -maxdepth 3 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    name: Deploy

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
